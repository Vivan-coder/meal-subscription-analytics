name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show SQLite version
        run: python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest
      - name: End-to-end smoke test (build, plan, audit, report)
        run: |
          python -m mealsub --db "$RUNNER_TEMP/smoke.db" build --customers 300
          python -m mealsub --db "$RUNNER_TEMP/smoke.db" verify
          python -m mealsub --db "$RUNNER_TEMP/smoke.db" recommend --all
          python -m mealsub --db "$RUNNER_TEMP/smoke.db" report --out "$RUNNER_TEMP/dash.html"
